<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suas Compras</title>
</head>
<body>
    <header class="logo">
        <a href="./pages/index.html">TechShop</a>
    </header>
    <main>
        <img src="./imagens/rastreio.png" alt="Rastreio de pedido techshop" width="500">
        <h1>Acompanhe seu pedido em tempo real!</h1>
    <section>
        <h2>Rastreie Seu Pedido:</h2>
        <form action="#tech-shop" method="post" onsubmit="alert(seu pedido já está a caminho!!!)">
            <label for="name">Nome:</label>
            <input type="text" id="name" name="nome" placeholder="seu nome" required>
            <label for="pedido">id do pedido</label>
            <input type="text" id="pedido" name="pedido" placeholder="id ex:(01417)" required>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>   
            <input type="submit" value="rastrear">
        </form>
    </section>
    </main>
</body>
</html>
